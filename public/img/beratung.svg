<svg viewBox="0 0 1400 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Fertig gestalteter Wohnraum in warmen Naturtönen">
  <defs>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE4D0"/><stop offset="1" stop-color="#E4D6BE"/>
    </linearGradient>
    <pattern id="rweave" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#CFA167"/><rect width="8" height="16" fill="#B5854A"/>
    </pattern>
  </defs>
  <rect width="1400" height="600" fill="url(#rbg)"/>
  <rect y="470" width="1400" height="130" fill="#D8C4A2"/>

  <!-- wall art trio -->
  <rect x="120" y="90" width="120" height="150" rx="4" fill="#F6F1E8" stroke="#2A2420" stroke-width="4"/>
  <rect x="260" y="120" width="90" height="120" rx="4" fill="#F6F1E8" stroke="#2A2420" stroke-width="4"/>
  <circle cx="180" cy="165" r="30" fill="#B8824A"/>
  <path d="M275 220 l25 -55 20 30 20 -40 v65 Z" fill="#5E6048"/>

  <!-- sofa -->
  <path d="M470 300 q0 -50 55 -50 h360 q55 0 55 50 v130 h-470 Z" fill="#B8824A"/>
  <rect x="455" y="410" width="500" height="60" rx="16" fill="#9A6B38"/>
  <rect x="500" y="330" width="120" height="90" rx="14" fill="#EFE4D0"/>
  <rect x="740" y="330" width="120" height="90" rx="14" fill="#5E6048"/>
  <rect x="480" y="470" width="20" height="40" fill="#4A3B2E"/>
  <rect x="910" y="470" width="20" height="40" fill="#4A3B2E"/>

  <!-- round coffee table + basket -->
  <ellipse cx="700" cy="500" rx="120" ry="24" fill="#6E5A46"/>
  <path d="M1000 430 h150 l-20 110 h-110 Z" fill="url(#rweave)" stroke="#3A2712" stroke-width="7"/>
  <rect x="985" y="414" width="180" height="22" rx="10" fill="#E3BC7C" stroke="#3A2712" stroke-width="6"/>

  <!-- big plant right -->
  <path d="M1200 470 h110 l-16 -120 h-78 Z" fill="#C08A4C" stroke="#3A2712" stroke-width="6"/>
  <g stroke="#5E6048" stroke-width="10" fill="none" stroke-linecap="round">
    <path d="M1255 350 C1220 250 1185 235 1160 214"/>
    <path d="M1255 350 C1292 250 1330 240 1352 224"/>
    <path d="M1255 350 C1255 240 1255 205 1255 176"/>
  </g>
  <g fill="#8E9670">
    <ellipse cx="1154" cy="208" rx="34" ry="15" transform="rotate(-35 1154 208)"/>
    <ellipse cx="1358" cy="218" rx="34" ry="15" transform="rotate(35 1358 218)"/>
    <ellipse cx="1255" cy="170" rx="17" ry="38"/>
  </g>
</svg>
