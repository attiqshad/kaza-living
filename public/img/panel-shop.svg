<svg viewBox="0 0 800 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gestapelte geflochtene Körbe">
  <defs>
    <linearGradient id="sbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C8975A"/><stop offset="1" stop-color="#8C5F32"/>
    </linearGradient>
    <pattern id="sweave" width="16" height="16" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#D2A264"/>
      <rect width="8" height="16" fill="#B7864A"/>
    </pattern>
    <pattern id="sweave2" width="16" height="16" patternTransform="rotate(-45)" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#C08A4C"/>
      <rect width="8" height="16" fill="#A5713A"/>
    </pattern>
  </defs>
  <rect width="800" height="1000" fill="url(#sbg)"/>
  <ellipse cx="400" cy="560" rx="340" ry="150" fill="#7C5228" opacity=".35"/>

  <!-- big basket -->
  <path d="M250 560 h300 l-40 300 h-220 Z" fill="url(#sweave)" stroke="#3A2712" stroke-width="9"/>
  <rect x="230" y="540" width="340" height="30" rx="14" fill="#E0B676" stroke="#3A2712" stroke-width="8"/>
  <path d="M300 560 v300 M400 560 v300 M500 560 v300" stroke="#3A2712" stroke-width="4" opacity=".4"/>

  <!-- medium basket (behind/left) -->
  <path d="M150 470 h190 l-24 150 h-142 Z" fill="url(#sweave2)" stroke="#3A2712" stroke-width="8"/>
  <rect x="138" y="454" width="214" height="24" rx="11" fill="#D8AC6C" stroke="#3A2712" stroke-width="7"/>

  <!-- small round basket (right) -->
  <path d="M500 430 c0 0 -20 90 40 110 c60 -20 40 -110 40 -110 Z" fill="url(#sweave)" stroke="#3A2712" stroke-width="8"/>
  <ellipse cx="540" cy="428" rx="52" ry="18" fill="#E0B676" stroke="#3A2712" stroke-width="7"/>
</svg>
